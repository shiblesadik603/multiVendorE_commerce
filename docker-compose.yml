# Local development stack. Credentials are for local use only.
# Infra only:        docker compose up -d postgres redis
# Everything:        docker compose up -d --build
x-common-env: &common-env
  NODE_ENV: production
  CORS_ORIGIN: http://localhost:3000
  REDIS_URL: redis://redis:6379
  # DEV-ONLY secrets. Real environments inject their own from a secret store; never commit real ones.
  JWT_ACCESS_SECRET: dev-only-access-secret-change-me-32chars-min
  INTERNAL_JWT_SECRET: dev-only-internal-secret-change-me-32chars-min

services:
  postgres:
    image: postgres:16
    container_name: marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    restart: unless-stopped
    ports: ["6379:6379"]

  auth-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { SERVICE: auth-service, PORT: "4001" }
    environment:
      <<: *common-env
      PORT: 4001
      DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/auth_db?schema=public
    ports: ["4001:4001"]
    depends_on:
      redis: { condition: service_started }
      postgres: { condition: service_healthy }

  catalog-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { SERVICE: catalog-service, PORT: "4002" }
    environment:
      <<: *common-env
      PORT: 4002
    ports: ["4002:4002"]
    depends_on:
      redis: { condition: service_started }

  cart-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { SERVICE: cart-service, PORT: "4003" }
    environment:
      <<: *common-env
      PORT: 4003
    ports: ["4003:4003"]
    depends_on:
      redis: { condition: service_started }

  inventory-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { SERVICE: inventory-service, PORT: "4004" }
    environment:
      <<: *common-env
      PORT: 4004
    ports: ["4004:4004"]
    depends_on:
      redis: { condition: service_started }

  order-service:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { SERVICE: order-service, PORT: "4005" }
    environment:
      <<: *common-env
      PORT: 4005
    ports: ["4005:4005"]
    depends_on:
      redis: { condition: service_started }

volumes:
  pgdata:
