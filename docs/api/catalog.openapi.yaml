openapi: 3.0.3
info:
  title: Catalog Service
  version: 0.2.0
  description: "Day 6 implemented: categories, public catalog, seller product CRUD. Day 9 adds seller apply/approval and admin moderation. Stock comes from inventory-service (Day 12). Prices are integer minor units (19999 = 199.99)."
servers: [{ url: "http://localhost:4002" }]
paths:
  /api/v1/categories:
    get:
      summary: List categories (public)
      responses:
        '200': { description: "{data:[{id,name,slug,parentId}]}" }
  /api/v1/products:
    get:
      summary: Public product list (ACTIVE + approved products from approved sellers only)
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 }, description: "case-insensitive match on title or description" }
        - { name: category, in: query, schema: { type: string }, description: category slug }
        - { name: minPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc], default: newest } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Paged products
          content:
            application/json:
              example:
                data:
                  - id: "4f7839f5-2090-4b6d-8445-ad1e522de493"
                    title: Wireless Headphones
                    description: ANC, 30h battery
                    price: 19999
                    imageUrl: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
                    images: [{ url: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500", position: 0 }]
                    category: { id: "uuid", name: Electronics, slug: electronics }
                    seller: { id: "uuid", shopName: "Seller-1a2b3c4d" }
                    createdAt: "2026-10-30T10:00:00.000Z"
                meta: { page: 1, limit: 20, total: 1, totalPages: 1 }
        '422': { description: "Invalid query (e.g. limit>50, minPrice>maxPrice)" }
  /api/v1/products/{id}:
    get:
      summary: Product detail (404 if archived, hidden, or seller not approved)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: "{data: product}" }
        '404': { description: Not found }
        '422': { description: Invalid id }
  /api/v1/seller/products:
    get:
      summary: Own products, any status (SELLER role)
      security: [{ bearer: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, ARCHIVED] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses: { '200': { description: "Same shape as public + status, moderation, updatedAt" }, '401': { description: Not logged in }, '403': { description: Not a seller } }
    post:
      summary: Create a product
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            example: { title: Wireless Headphones, description: "ANC, 30h battery", price: 19999, category: electronics, imageUrls: ["https://example.com/a.jpg"] }
      responses:
        '201': { description: Created (status ACTIVE) }
        '403': { description: "SELLER_NOT_APPROVED" }
        '422': { description: "Field errors: title 3-150, description 1-5000, price integer >=1, category slug or categoryId, imageUrls http(s) max 8" }
  /api/v1/seller/products/{id}:
    get: { summary: Own product, security: [{ bearer: [] }], responses: { '200': { description: OK }, '404': { description: "Missing OR owned by another seller" } } }
    patch:
      summary: Edit own product (any subset of fields; imageUrls replaces all images)
      security: [{ bearer: [] }]
      responses: { '200': { description: OK }, '404': { description: "Missing OR owned by another seller" }, '422': { description: "Validation / empty body" } }
  /api/v1/seller/products/{id}/archive:
    post: { summary: Archive (hide from buyers; nothing deleted), security: [{ bearer: [] }], responses: { '200': { description: OK }, '404': { description: Not yours } } }
  /api/v1/seller/products/{id}/activate:
    post: { summary: Re-activate an archived product, security: [{ bearer: [] }], responses: { '200': { description: OK }, '404': { description: Not yours } } }
components:
  securitySchemes: { bearer: { type: http, scheme: bearer, bearerFormat: JWT } }
