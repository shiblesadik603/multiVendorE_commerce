openapi: 3.0.3
info: { title: Auth Service, version: 0.1.0, description: "Implemented (Day 4). Base: /api/v1/auth" }
servers: [{ url: "http://localhost:4001" }]
paths:
  /api/v1/auth/register:
    post:
      summary: Register a buyer or seller (admins cannot self-register)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example: { name: Rahim Uddin, email: rahim@example.com, phone: "01712345678", password: secret123, role: BUYER }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { user: { $ref: '#/components/schemas/User' } } } } } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/login:
    post:
      summary: Login with email or phone. Sets httpOnly refreshToken cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { identifier: rahim@example.com, password: secret123 }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/refresh:
    post:
      summary: Rotate the refresh cookie and return a new access token
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      summary: Revoke the refresh token and clear the cookie
      responses: { '204': { description: Logged out } }
  /api/v1/auth/me:
    get:
      summary: Current user
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { user: { $ref: '#/components/schemas/User' } } } } } } } }
        '401': { $ref: '#/components/responses/Error' }
  /health: { get: { summary: Liveness, responses: { '200': { description: ok } } } }
  /ready: { get: { summary: Readiness (checks DB), responses: { '200': { description: ready }, '503': { description: unavailable } } } }
components:
  securitySchemes: { bearer: { type: http, scheme: bearer, bearerFormat: JWT } }
  schemas:
    User:
      type: object
      properties: { id: { type: string, format: uuid }, name: { type: string }, email: { type: string }, phone: { type: string }, role: { type: string, enum: [BUYER, SELLER, ADMIN] } }
    RegisterRequest:
      type: object
      required: [name, email, phone, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string, pattern: '^\+?\d{10,15}$' }
        password: { type: string, minLength: 6, maxLength: 72 }
        role: { type: string, enum: [BUYER, SELLER], default: BUYER }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties: { identifier: { type: string, description: email or phone }, password: { type: string } }
    ErrorBody:
      type: object
      properties: { error: { type: object, properties: { code: { type: string }, message: { type: string }, details: { type: array, items: { type: object } } } } }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorBody' } } } }
    Session:
      description: Access token + user
      content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { user: { $ref: '#/components/schemas/User' }, accessToken: { type: string } } } } } } }
